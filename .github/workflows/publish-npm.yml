name: Publish npm package
on:
  push:
    tags: ['vitepress-playground-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DPS_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run check:release-tag -- "$GITHUB_REF_NAME"
      - name: Publish to npm when credentials are configured
        run: |
          if [ -n "$DPS_NPM_TOKEN" ]; then
            NODE_AUTH_TOKEN="$DPS_NPM_TOKEN" npm publish --access public --provenance
          else
            echo 'npm publication skipped; configure NPM_TOKEN in this repository.'
          fi
