name: Release playground archive
on:
  push:
    tags: ['vitepress-playground-v*']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:release-tag -- "$GITHUB_REF_NAME"
      - run: npm run check
      - run: mkdir -p dist
      - run: npm pack --pack-destination dist
      - name: Publish tarball and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.tgz > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.tgz SHA256SUMS.txt --title "$GITHUB_REF_NAME" --verify-tag
